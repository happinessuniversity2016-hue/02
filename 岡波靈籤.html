<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岡波聖地靈籤集 – 下載 App</title>
<style>
  :root{
    --amber-light:#f5d9a8;
    --amber:#e8b96a;
    --amber-deep:#d9995c;
    --navy:#3d5474;
    --navy-deep:#2c3e57;
    --ink:#4a3620;
    --cream:#faf3e3;
    --muted:#8a6f4d;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    background:linear-gradient(180deg,var(--amber-light) 0%,var(--amber-deep) 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:420px;
    width:100%;
    text-align:center;
    padding:24px 12px;
  }
  .app-icon{
    width:120px;height:120px;
    border-radius:28px;
    margin:0 auto 28px;
    display:block;
    box-shadow:0 10px 32px rgba(74,54,32,.35), 0 0 0 1px rgba(250,243,227,.6);
  }
  h1{
    font-size:1.6rem;
    letter-spacing:.1em;
    color:var(--ink);
    margin-bottom:10px;
    font-weight:600;
  }
  p.sub{
    color:var(--muted);
    font-size:.95rem;
    margin-bottom:36px;
    line-height:1.7;
  }
  .btn{
    display:flex;align-items:center;justify-content:center;
    width:100%;
    padding:16px 20px;
    border-radius:14px;
    text-decoration:none;
    margin-bottom:16px;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-ios{
    background:var(--navy);
    color:var(--cream);
  }
  .btn-ios:hover{background:var(--navy-deep);box-shadow:0 6px 18px rgba(44,62,87,.35);}
  .btn-android{
    background:var(--cream);
    color:var(--navy-deep);
    border:1.5px solid rgba(61,84,116,.45);
  }
  .btn-android:hover{background:#fffdf7;box-shadow:0 6px 18px rgba(74,54,32,.2);}
  .btn small{display:block;font-weight:400;font-size:.72rem;opacity:.8;letter-spacing:.02em;}
  .btn .label{text-align:center;line-height:1.3;font-size:1.1rem;font-weight:600;}
  .redirect-note{
    display:none;
    color:var(--muted);
    font-size:.85rem;
    margin-top:10px;
  }
  @media (prefers-reduced-motion: reduce){
    .btn{transition:none;}
  }
</style>
</head>
